<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Context Capsule</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      padding: 12px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px 0;
    }
    .capsule-row {
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
    }
    .capsule-row .title {
      font-weight: 600;
    }
    .capsule-row .meta {
      color: #888;
      font-size: 11px;
      margin: 2px 0 6px 0;
    }
    .capsule-row button {
      font-size: 11px;
      padding: 3px 8px;
      margin-right: 6px;
      cursor: pointer;
    }
    .empty {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Saved Capsules</h1>
  <div id="capsule-list"></div>
  <script src="popup.js"></script>
</body>
</html>
